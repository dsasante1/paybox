# paybox configuration. Every value can also be set by environment variable
# (PAYBOX_*), and the environment wins. See docs/getting-started.md.

host: 127.0.0.1
port: 8080

database:
  path: ./data/paybox.db

# Identical seeds produce identical ids, references and retry jitter.
seed: paybox

# Freeze the clock for fully deterministic runs. Drive it with
# `paybox time advance 30s`.
freezeClock: false
startAt: null

webhooks:
  retry:
    enabled: true
    maxAttempts: 5
    # "exponential" (default) or "paystack" for the provider's real ladder:
    # hourly for ten hours. Unhelpful live, free under a frozen clock --
    # `paybox time advance 12h` runs it to exhaustion instantly.
    schedule: exponential
  timeoutMs: 10000

providers:
  paystack:
    enabled: true

security:
  # Relaxes the sk_test_ format check. Live keys are refused regardless.
  allowAnyKey: false

simulation:
  # Test instruments play their outcome out automatically after a short delay,
  # the way a real mobile-money prompt or card authorization would. Turn off to
  # drive every transition explicitly.
  autoAdvance: true
  autoAdvanceDelayMs: 3000

balance:
  # Refuse a transfer the balance cannot cover, as a real provider does.
  enforce: true
  # Opening test float per currency, in minor units. Set to 0 to start empty
  # and exercise the insufficient-funds path from the very first transfer.
  opening: 10000000
  # Transfer fee per currency, in minor units, held against the balance
  # alongside the amount. Paystack's real schedule is tiered, varies by
  # country, and lives on their pricing page rather than in the API docs, so
  # this is a flat approximation — set your own negotiated rate here.
  transferFee:
    NGN: 1000
    GHS: 800
    ZAR: 300
    KES: 3000
    USD: 100

logLevel: info
