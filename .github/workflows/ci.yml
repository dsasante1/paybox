# Verify every change before it reaches main.
#
# The coverage contract (tests/coverage-drift.test.ts) and the determinism
# rules (eslint.config.js) only protect anything if they actually run. Without
# this, a pull request adding an undeclared route — or a `Date.now()` in the
# engine — would show as mergeable and nothing would object.
#
# Node is a matrix rather than a single version: `node:sqlite` is what sets the
# >=22.5 requirement in package.json, it is still marked experimental, and its
# API has moved between majors. The matrix catches both "broke the Node line we
# claim to support" and "broke on what people actually run".
#
# `22` means the latest 22.x, not 22.5.0 exactly. Vitest's rolldown binding
# does not resolve on the oldest 22 patch — it falls back to a wasm32-wasi
# build that is not installed — so the *test runner* cannot start there even
# though typecheck and lint pass. That is a dev-toolchain limit, not a paybox
# one: nothing a consumer installs runs vitest, so the >=22.5.0 floor in
# package.json is still the right claim about the package itself.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run for the same ref. Queued CI on a
# branch someone is still pushing to is wasted minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Report every failing combination, not just the first. Knowing a change
      # breaks only the older Node is more useful than knowing it broke.
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci`, not `install`: it installs exactly the lockfile and fails if
      # package.json and the lockfile have drifted apart, which is itself worth
      # catching.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the determinism rules — no Date.now(), Math.random() or
      # setTimeout outside the few exempt paths. See eslint.config.js.
      - name: Lint
        run: npm run lint

      # Includes tests/coverage-drift.test.ts, which fails if an adapter serves
      # a route it has not declared, declares one it does not serve, or if the
      # README's generated coverage table has gone stale.
      - name: Test
        run: npm test

      # Bundles the publishable package, and fails if apps/paybox/package.json
      # and the bundle's actual imports disagree in either direction
      # (scripts/build.mjs) — a missing dependency would otherwise surface as
      # a crash on a developer's machine after `npx`.
      - name: Build
        run: npm run build

      # Packs the package, installs the tarball into an empty directory with
      # production dependencies only, and drives the `paybox` binary that
      # produced. Everything above tests the source tree; this is the only
      # step that tests what `npx paybox-emulator` actually hands a developer.
      # On the 22 lane it also proves the launcher keeps node:sqlite's
      # ExperimentalWarning off stderr.
      - name: Package smoke test
        run: npm run smoke:package

  # The Dockerfile is a second artifact with its own way of going stale: it
  # once listed the workspace manifests to copy by hand, stopped at one
  # provider of five, and nothing noticed because nothing built it. Now every
  # pull request builds the image, boots it, waits for /api/health, and runs
  # the CLI inside it. Single platform here; the release workflow does the
  # multi-arch build and shares this job's layer cache.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: paybox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot, wait for health, drive the CLI inside the container
        run: |
          docker run -d --name paybox -p 127.0.0.1:8080:8080 -e PAYBOX_DATABASE=:memory: paybox:ci
          healthy=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null; then healthy=1; break; fi
            sleep 0.5
          done
          echo "--- container output ---"
          docker logs paybox
          echo "------------------------"
          if [ "$healthy" != 1 ]; then
            echo "::error::the image did not answer /api/health within 30s"
            exit 1
          fi
          docker exec paybox paybox status
          docker exec paybox paybox time advance 5s
          if docker logs paybox 2>&1 | grep -q ExperimentalWarning; then
            echo "::error::node:sqlite's ExperimentalWarning reached stderr; the launcher should keep it off"
            exit 1
          fi

  # TEMPORARY — exists only on this throwaway branch, never merged. Proves the
  # DOCKERHUB_TOKEN secret stored through the browser is a valid, non-empty
  # token, without publishing anything.
  dockerhub-secret-check:
    name: dockerhub secret check (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log in to Docker Hub with the stored secret
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
